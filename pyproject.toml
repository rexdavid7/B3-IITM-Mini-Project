[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rfp-evaluation"
version = "0.1.0"
description = "Deterministic and LLM-assisted supplier proposal evaluation foundation"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<3",
    "google-genai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]
